name: Update dependencies

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: update-dependencies
  cancel-in-progress: false

permissions: {}

jobs:
  update-dependencies:
    if: github.repository == 'edouardmisset/unified-climbing-projects'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create dependency-update GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.DEPENDENCY_UPDATE_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_UPDATE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: unified-climbing-projects

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: false

      - uses: pnpm/update@76f98d727df25f56f9bbd38e60ad663fd785d3d4 # v0.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          update-deps: ranges
          update-pnpm: '11'
          node: false
          refresh-lockfile: true
          changesets: false
          github-actions: false
          verify: |
            pnpm audit --audit-level=high
            pnpm run check:ci
            pnpm run test
