name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format Lint Typecheck Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # skip pushes that are just a merged/squashed PR already validated on the pull_request event
    if: |
      github.event_name != 'push' ||
      (!startsWith(github.event.head_commit.message, 'Merge pull request') &&
       !contains(github.event.head_commit.message, '(#'))
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v1
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check format, lint, and type safety
        run: pnpm run check

      - name: Run tests with coverage gates
        run: pnpm run test:coverage

  visual:
    name: Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v1
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Compare visual baselines
        run: pnpm run test:visual

  e2e-smoke:
    name: Read-only E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v1
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run read-only smoke tests
        run: pnpm run test:e2e:smoke
