packages:
  - .

overrides:
  baseline-browser-mapping: 2.11.19
  postcss: ^8.5.18
  sharp: ^0.35.0
  vite: 'catalog:'
  vitest: 'catalog:'

allowBuilds:
  '@clerk/shared': true
  '@vercel/speed-insights': true
  core-js: true
  esbuild: true
  oxc-resolver: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - eslint-config-prettier@9.1.2
  - semver@6.3.1
blockExoticSubdeps: true
trustLockfile: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.4
  vitest: 4.1.10
  vite-plus: 0.2.4
  '@vitest/coverage-v8': 4.1.10
  '@vitest/ui': 4.1.10
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
minimumReleaseAgeExclude:
  - '@tanstack/charts@0.12.0'
